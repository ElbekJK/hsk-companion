name: Source self-tests
on:
  push:
  pull_request:
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run source and content tests
        run: bash scripts/test_project.sh
      - name: Check public source artifacts
        run: python3 scripts/check_public_source.py
